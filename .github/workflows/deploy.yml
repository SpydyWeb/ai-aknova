name: Deploy to MilesWeb

# Every push to main rebuilds the site and uploads it. That includes each save in the admin panel,
# which is a commit to content/site.json or content/uploads made by public/api/index.php.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A save made during an upload waits for it, instead of cutting the upload off halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite build, then scripts/prerender.mjs writes one HTML page per address from content/site.json.
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Upload to MilesWeb over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
