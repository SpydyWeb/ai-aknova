name: Deploy to MilesWeb

# Every push to main rebuilds the site and uploads it. The admin panel also starts this after each
# save, so the prebuilt pages (what search engines read) catch up with the database.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A save made during an upload waits for it, instead of cutting the upload off halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The content lives in the site's database, not in this repository. Build from the live copy;
      # if the site cannot be reached (first deploy), the copy in content/site.json is used.
      - name: Fetch the live content
        run: curl -fsS --max-time 30 https://www.aknovatech.com/api/content -o live.json && mv live.json content/site.json || echo "Using content/site.json from the repository"

      # vite build, then scripts/prerender.mjs writes one HTML page per address from content/site.json.
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          LIVE_CONTENT: '1'

      - name: Upload to MilesWeb over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
